<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>2048 Tetris Battle: ONLINE</title>
    <!-- İnternet üzerinden haberleşmek için Socket.io CDN'i ekliyoruz -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f16; color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        #start-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background: radial-gradient(circle at center, #2a2a3a 0%, #0f0f16 100%); z-index: 1000; position: absolute; }
        h1 { font-size: 48px; text-shadow: 0 0 20px rgba(255,255,255,0.8); margin-bottom: 30px; text-transform: uppercase; }
        .selection-container { display: flex; gap: 50px; margin-bottom: 40px; }
        .player-select { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 2px solid #555; width: 340px; text-align: center; }
        .class-wrapper { margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; }
        .class-btn { background: #222; border: 2px solid #444; color: white; padding: 10px; margin: 0 0 8px 0; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .class-btn:hover { background: #444; }
        .class-btn.selected { background: #2196F3; border-color: #fff; box-shadow: 0 0 10px #2196F3; }
        .class-stats { font-size: 12px; color: #fff; font-weight: bold; margin-bottom: 5px; }
        .class-desc { font-size: 11px; color: #aaa; line-height: 1.4; }
        #start-btn { background: linear-gradient(45deg, #ff416c, #ff4b2b); border: none; color: white; padding: 15px 50px; font-size: 24px; font-weight: 900; border-radius: 30px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 20px rgba(255,75,43,0.6); transition: transform 0.2s; }
        #start-btn:hover { transform: scale(1.1); }
        #start-btn:disabled { background: #555; cursor: not-allowed; box-shadow: none; transform: none; }
        #game-screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; padding-top: 10px; }
        .battle-arena { display: flex; gap: 60px; position: relative; margin-top: 10px; }
        .player-box { display: flex; flex-direction: column; align-items: center; background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 15px; border: 2px solid #333; position: relative; width: 420px; }
        .p1-box { border-color: #2196F3; box-shadow: inset 0 0 50px rgba(33, 150, 243, 0.05); }
        .p2-box { border-color: #f44336; box-shadow: inset 0 0 50px rgba(244, 67, 54, 0.05); }
        .header-info { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .player-title { font-size: 20px; font-weight: 900; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        .class-icon { font-size: 24px; }
        .bars-container { width: 100%; margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .bar-bg { width: 100%; background: #1a1a24; border-radius: 6px; position: relative; border: 1px solid #555; overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .bar-fill { height: 100%; transition: width 0.3s ease-out; }
        .bar-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; text-shadow: 1px 1px 3px black, -1px -1px 3px black; z-index: 2; color: #fff; letter-spacing: 1px; }
        .hp-fill { background: linear-gradient(90deg, #d32f2f, #ff1744); }
        .shield-fill { background: linear-gradient(90deg, #1976D2, #00b0ff); }
        .rage-fill { background: linear-gradient(90deg, #f57f17, #ffea00); }
        .attack-fill { background: linear-gradient(90deg, #7b1fa2, #ab47bc); }
        .tetris-grid { display: grid; grid-template-columns: repeat(6, 52px); grid-template-rows: repeat(8, 52px); gap: 4px; background: #111118; padding: 6px; border-radius: 8px; border: 1px solid #333; position: relative; }
        .cell { width: 52px; height: 52px; background: #1e1e2c; border-radius: 6px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 22px; font-weight: 900; transition: transform 0.1s; position: relative; }
        .special-icon { position: absolute; top: 2px; right: 2px; font-size: 14px; text-shadow: 0 0 5px black; }
        .val-2    { background: #eee4da; color: #776e65; }
        .val-4    { background: #ede0c8; color: #776e65; }
        .val-8    { background: #f2b179; color: white; }
        .val-16   { background: #f59563; color: white; }
        .val-32   { background: #f67c5f; color: white; box-shadow: inset 0 0 10px rgba(0,0,0,0.3); }
        .val-64   { background: #f65e3b; color: white; box-shadow: inset 0 0 15px rgba(0,0,0,0.3); }
        .val-128  { background: #edcf72; color: white; font-size: 18px; box-shadow: 0 0 10px #edcf72; }
        .val-256  { background: #edcc61; color: white; font-size: 18px; box-shadow: 0 0 15px #edcc61; }
        .val-512  { background: #edc850; color: white; font-size: 18px; box-shadow: 0 0 20px #edc850; }
        .val-1024 { background: #edc53f; color: white; font-size: 15px; box-shadow: 0 0 25px #edc53f; }
        .val-2048 { background: #edc22e; color: white; font-size: 15px; box-shadow: 0 0 30px #edc22e; }
        .val-garbage { background: linear-gradient(135deg, #555, #333); color: transparent; border: 2px solid #222; box-shadow: inset 0 0 10px black; background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.2) 10px, rgba(0,0,0,0.2) 20px); }
        .frozen { filter: hue-rotate(180deg) brightness(1.5) grayscale(0.5); border: 2px solid cyan; box-shadow: 0 0 10px cyan; }
        @keyframes shake { 0% { transform: translate(2px, 1px) rotate(0deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 40% { transform: translate(3px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 80% { transform: translate(3px, 1px) rotate(1deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
        .shake { animation: shake 0.4s ease-in-out; }
        .floating-text { position: absolute; font-size: 26px; font-weight: 900; text-shadow: 0 0 5px black, 0 0 15px currentColor; pointer-events: none; animation: floatUp 1s forwards ease-out; z-index: 100; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.2); } }
        .attack-alert { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 45px; font-family: 'Impact', sans-serif; text-transform: uppercase; color: #fff; text-shadow: 0 0 20px red, 4px 4px 0px #000; z-index: 200; pointer-events: none; animation: alertPop 1s forwards ease-out; white-space: nowrap; }
        @keyframes alertPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -100%) scale(1.5); opacity: 0; } }
        .controls-hint { margin-top: 15px; color: #888; font-size: 13px; text-align: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; width: 100%; }
        #game-over { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 500; }
        #game-over h2 { font-size: 60px; color: #fff; text-shadow: 0 0 30px #f44336; margin-bottom: 20px; }
        #restart-btn { padding: 15px 40px; font-size: 20px; cursor: pointer; background: #fff; color: #000; border: none; border-radius: 30px; font-weight: bold; }
        .ultimate-btn { position: absolute; top: -25px; right: -25px; width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle, #ffeb3b, #f57f17); border: 3px solid #fff; color: #000; font-weight: 900; font-size: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; text-align: center; box-shadow: 0 0 20px #ffeb3b; z-index: 50; transition: transform 0.2s; opacity: 0.5; pointer-events: none; }
        .ultimate-btn.ready { opacity: 1; pointer-events: auto; animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); box-shadow: 0 0 10px #ffeb3b; } to { transform: scale(1.1); box-shadow: 0 0 30px #ffeb3b; } }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>⚔️ 2048 Tetris Battle ⚔️</h1>
        <div class="selection-container">
            <div class="player-select p1-select">
                <h2 style="color: #2196F3; margin-bottom:15px;">KARAKTERİNİ SEÇ</h2>
                <div id="my-classes"></div>
            </div>
        </div>
        <button id="start-btn">SAVAŞA BAŞLA</button>
    </div>

    <div id="game-screen">
        <div class="battle-arena">
            <!-- SENİN EKRANIN -->
            <div class="player-box p1-box" id="p1-box">
                <div class="ultimate-btn" id="p1-ult">RAGE<br>(Q/Enter)</div>
                <div class="header-info">
                    <div class="player-title" style="color: #2196F3;"><span class="class-icon" id="p1-icon">⚔️</span> SEN</div>
                </div>
                <div class="bars-container">
                    <div class="bar-bg" style="height: 26px;"><div id="p1-hp-fill" class="bar-fill hp-fill" style="width:100%"></div><div id="p1-hp-text" class="bar-text">❤️ 250 / 250</div></div>
                    <div class="bar-bg" style="height: 26px;"><div id="p1-shield-fill" class="bar-fill shield-fill" style="width:100%"></div><div id="p1-shield-text" class="bar-text">🛡️ 50 / 50</div></div>
                    <div class="bar-bg" style="height: 22px;"><div id="p1-rage-fill" class="bar-fill rage-fill" style="width:0%"></div><div id="p1-rage-text" class="bar-text" style="font-size: 13px;">🔥 ÖFKE: %0</div></div>
                </div>
                <div id="grid1" class="tetris-grid"></div>
                <div class="bars-container" style="margin-top:15px; margin-bottom:0;">
                    <div class="bar-bg" style="height: 26px; border-color:#9c27b0;">
                        <div id="p1-attack-fill" class="bar-fill attack-fill" style="width:0%"></div>
                        <div id="p1-attack-text" class="bar-text">⚔️ ÇÖP BARI: 0 / 100</div>
                    </div>
                </div>
                <div class="controls-hint">YÖN TUŞLARI veya WASD: Hareket | Q veya Enter: Ultimate</div>
            </div>

            <!-- RAKİBİN EKRANI -->
            <div class="player-box p2-box" id="p2-box">
                <div class="header-info">
                    <div class="player-title" style="color: #f44336;"><span class="class-icon" id="p2-icon">🛡️</span> RAKİP</div>
                </div>
                <div class="bars-container">
                    <div class="bar-bg" style="height: 26px;"><div id="p2-hp-fill" class="bar-fill hp-fill" style="width:100%"></div><div id="p2-hp-text" class="bar-text">❤️ 250 / 250</div></div>
                    <div class="bar-bg" style="height: 26px;"><div id="p2-shield-fill" class="bar-fill shield-fill" style="width:100%"></div><div id="p2-shield-text" class="bar-text">🛡️ 50 / 50</div></div>
                    <div class="bar-bg" style="height: 22px;"><div id="p2-rage-fill" class="bar-fill rage-fill" style="width:0%"></div><div id="p2-rage-text" class="bar-text" style="font-size: 13px;">🔥 ÖFKE: %0</div></div>
                </div>
                <div id="grid2" class="tetris-grid"></div>
                <div class="bars-container" style="margin-top:15px; margin-bottom:0;">
                    <div class="bar-bg" style="height: 26px; border-color:#9c27b0;">
                        <div id="p2-attack-fill" class="bar-fill attack-fill" style="width:0%"></div>
                        <div id="p2-attack-text" class="bar-text">⚔️ ÇÖP BARI: 0 / 100</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over">
        <h2 id="winner-text">OYUNCU KAZANDI!</h2>
        <button id="restart-btn" onclick="location.reload()">Yeni Rakip Bul</button>
    </div>

    <script>
        // DIKKAT: AŞAĞIDAKİ ADRESİ KENDİ KURDUĞUN SUNUCU LİNKİYLE DEĞİŞTİR
        const socket = io("https://2048-backend-xyz.onrender.com");

        const ROWS = 8;
        const COLS = 6;
        const ATTACK_THRESHOLD = 100;

        const CLASS_TYPES = {
            'Warrior': { icon: '⚔️', hp: 250, shield: 50, dmgMult: 1.3, defMult: 1.0, specialRate: 0.1, desc: '+%30 Hasar, Normal Savunma' },
            'Tank': { icon: '🛡️', hp: 320, shield: 120, dmgMult: 0.8, defMult: 0.6, specialRate: 0.05, desc: 'Yüksek HP/Kalkan, Daha az hasar alır' },
            'Mage': { icon: '🧙', hp: 230, shield: 70, dmgMult: 0.9, defMult: 1.0, specialRate: 0.35, desc: 'Çok fazla Özel Blok düşer' },
            'Assassin': { icon: '⚡', hp: 200, shield: 30, dmgMult: 1.0, comboMult: 2.0, defMult: 1.2, specialRate: 0.15, desc: 'Kombolar 2x Hasar vurur, Kırılgan' }
        };

        const SPECIALS = [
            { id: 'bomb', icon: '💣', color: '#ff3d00' },
            { id: 'lightning', icon: '⚡', color: '#ffea00' },
            { id: 'freeze', icon: '❄️', color: '#00e5ff' },
            { id: 'burn', icon: '🔥', color: '#ff9100' }
        ];

        let mySelectedClass = 'Warrior';
        let myRole = null; 
        let localPlayer = null;
        let enemyPlayer = null;
        let isGameActive = false;
        let tickInterval;

        function setupClassSelect() {
            const p1Div = document.getElementById('my-classes');
            Object.keys(CLASS_TYPES).forEach(cls => {
                const info = CLASS_TYPES[cls];
                const contentHtml = `<div class="class-stats">❤️ Can: ${info.hp} | 🛡️ Zırh: ${info.shield} <br> ⚔️ Hasar: ${info.dmgMult}x</div><div class="class-desc">${info.desc}</div>`;
                let wrapper = document.createElement('div'); wrapper.className = 'class-wrapper';
                let btn = document.createElement('div'); btn.className = `class-btn ${cls === mySelectedClass ? 'selected' : ''}`;
                btn.innerHTML = `<span>${info.icon} ${cls}</span>`;
                let text = document.createElement('div'); text.innerHTML = contentHtml;
                btn.onclick = () => { mySelectedClass = cls; Array.from(p1Div.querySelectorAll('.class-btn')).forEach(c => c.classList.remove('selected')); btn.classList.add('selected'); };
                wrapper.appendChild(btn); wrapper.appendChild(text); p1Div.appendChild(wrapper);
            });
        }
        setupClassSelect();

        document.getElementById('start-btn').onclick = () => {
            socket.emit('join_queue', { classType: mySelectedClass });
            document.getElementById('start-btn').innerText = 'Sunucuya Bağlanıyor...';
        };

        socket.on('waiting', (msg) => {
            document.getElementById('start-btn').innerText = msg;
            document.getElementById('start-btn').disabled = true;
        });

        socket.on('game_start', (data) => {
            myRole = data.role; 
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            localPlayer = new Player('p1', mySelectedClass, true);
            enemyPlayer = new Player('p2', data.opponentClass, false);

            isGameActive = true;
            
            tickInterval = setInterval(() => {
                if (isGameActive && localPlayer) {
                    localPlayer.drop(false);
                }
            }, 800);
        });

        socket.on('opponent_state', (data) => {
            if (enemyPlayer) {
                enemyPlayer.board = data.board;
                enemyPlayer.hp = data.hp;
                enemyPlayer.shield = data.shield;
                enemyPlayer.rage = data.rage;
                enemyPlayer.attackBar = data.attackBar;
                enemyPlayer.garbageQueue = data.garbageQueue;
                enemyPlayer.currentPiece = data.currentPiece;
                enemyPlayer.render();
                enemyPlayer.updateUI();
            }
        });

        socket.on('receive_attack', (data) => {
            if (localPlayer) {
                localPlayer.receiveAttack(data.dmg, data.garbageCount);
            }
        });

        socket.on('opponent_disconnected', () => {
            if (isGameActive) {
                endGame("Rakip Bağlantıyı Kopardı! Sen Kazandın 🏆");
            }
        });

        class Player {
            constructor(id, classType, isLeft) {
                this.id = id;
                this.stats = CLASS_TYPES[classType];
                this.isLeft = isLeft;
                this.hp = this.stats.hp;
                this.maxHp = this.stats.hp;
                this.shield = this.stats.shield;
                this.maxShield = this.stats.shield;
                this.rage = 0;
                this.attackBar = 0;
                this.board = Array(ROWS).fill().map(() => Array(COLS).fill(null));
                this.currentPiece = null;
                this.garbageQueue = 0;
                this.isFrozen = false;
                
                this.gridEl = document.getElementById(`grid${id}`);
                this.boxEl = document.getElementById(`${id}-box`);
                document.getElementById(`${id}-icon`).innerText = this.stats.icon;
                
                this.initDOM();
                if(this === localPlayer) this.spawnPiece(); 
                this.updateUI();
            }

            initDOM() {
                this.gridEl.innerHTML = '';
                for(let r=0; r<ROWS; r++) {
                    for(let c=0; c<COLS; c++) {
                        let cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.id = `${this.id}-c-${r}-${c}`;
                        this.gridEl.appendChild(cell);
                    }
                }
            }

            spawnPiece() {
                if(!isGameActive) return;
                
                if (this.garbageQueue > 0) {
                    this.currentPiece = { r: 0, c: Math.floor(Math.random()*COLS), val: -1, special: null };
                    this.garbageQueue--;
                } else {
                    const vals = [2, 2, 2, 4, 4, 8];
                    const val = vals[Math.floor(Math.random() * vals.length)];
                    const startCol = Math.floor(COLS / 2) - 1;
                    
                    let special = null;
                    if (Math.random() < this.stats.specialRate) {
                        special = SPECIALS[Math.floor(Math.random() * SPECIALS.length)];
                    }
                    this.currentPiece = { r: 0, c: startCol, val: val, special: special };
                }

                if (this.board[0][this.currentPiece.c] !== null) {
                    endGame("ÖLDÜN! RAKİP KAZANDI ☠️");
                    socket.emit('attack_opponent', { dmg: 9999, garbageCount: 0 }); 
                }
                this.render();
            }

            move(dirX) {
                if(!this.currentPiece || !isGameActive || this.isFrozen) return;
                let newC = this.currentPiece.c + dirX;
                if(newC >= 0 && newC < COLS && this.board[this.currentPiece.r][newC] === null) {
                    this.currentPiece.c = newC;
                    this.render();
                }
            }

            drop(hard = false) {
                if(!this.currentPiece || !isGameActive || this.isFrozen) return;
                
                if (hard) {
                    while(!this.checkColision(this.currentPiece.r + 1, this.currentPiece.c)) {
                        this.currentPiece.r++;
                    }
                    this.landPiece();
                } else {
                    if(!this.checkColision(this.currentPiece.r + 1, this.currentPiece.c)) {
                        this.currentPiece.r++;
                        this.render();
                    } else {
                        this.landPiece();
                    }
                }
            }

            checkColision(r, c) {
                if (r >= ROWS) return true;
                if (this.board[r][c] !== null) return true;
                return false;
            }

            landPiece() {
                this.board[this.currentPiece.r][this.currentPiece.c] = {
                    val: this.currentPiece.val,
                    special: this.currentPiece.special
                };
                this.currentPiece = null;
                this.processPhysics();
            }

            processPhysics() {
                let mergedInStep = true;
                let stepCombo = 0;
                let stepDamageDealt = 0;

                while (mergedInStep) {
                    mergedInStep = false;
                    this.applyGravity();

                    let hasMerged = false;
                    let toDestroy = []; 

                    for (let r = ROWS - 1; r >= 0 && !hasMerged; r--) {
                        for (let c = 0; c < COLS && !hasMerged; c++) {
                            let block = this.board[r][c];
                            if (!block || block.val === -1) continue; 

                            if (r < ROWS - 1 && this.board[r+1][c] && this.board[r+1][c].val === block.val) {
                                this.executeMerge(r, c, r+1, c, block, toDestroy);
                                hasMerged = true; stepCombo++;
                                stepDamageDealt += this.board[r+1][c].val;
                            }
                            else if (c < COLS - 1 && this.board[r][c+1] && this.board[r][c+1].val === block.val) {
                                this.executeMerge(r, c, r, c+1, block, toDestroy);
                                hasMerged = true; stepCombo++;
                                stepDamageDealt += this.board[r][c+1].val;
                            }
                        }
                    }

                    toDestroy.forEach(pos => { if(this.board[pos.r] && this.board[pos.r][pos.c]) this.board[pos.r][pos.c] = null; });
                    if(hasMerged || toDestroy.length > 0) mergedInStep = true;
                }

                if (stepDamageDealt > 0) {
                    let finalDmg = stepDamageDealt * this.stats.dmgMult;
                    if (stepCombo > 1 && this.stats.comboMult) {
                        finalDmg *= this.stats.comboMult;
                        this.showFloatingText('COMBO x' + stepCombo, '#ffea00');
                    }
                    
                    socket.emit('attack_opponent', { dmg: finalDmg, garbageCount: 0 });

                    this.attackBar += finalDmg;
                    this.rage = Math.min(100, this.rage + (finalDmg / 1.5)); 
                    
                    if (this.attackBar >= ATTACK_THRESHOLD) {
                        let attackCount = Math.floor(this.attackBar / ATTACK_THRESHOLD);
                        this.attackBar %= ATTACK_THRESHOLD;
                        this.fireGarbage(attackCount);
                    }
                }

                this.render();
                this.updateUI();
                if(this === localPlayer) this.spawnPiece();
            }

            executeMerge(r1, c1, r2, c2, block, toDestroy) {
                let newVal = block.val * 2;
                let keepSpecial = this.board[r2][c2].special || block.special; 
                this.board[r2][c2] = { val: newVal, special: keepSpecial };
                this.board[r1][c1] = null;

                const neighbors = [ {r:r2-1,c:c2}, {r:r2+1,c:c2}, {r:r2,c:c2-1}, {r:r2,c:c2+1} ];
                neighbors.forEach(n => {
                    if(n.r>=0 && n.r<ROWS && n.c>=0 && n.c<COLS && this.board[n.r][n.c] && this.board[n.r][n.c].val === -1) {
                        toDestroy.push({r:n.r, c:n.c});
                    }
                });

                if (keepSpecial) {
                    this.triggerSpecial(keepSpecial.id, r2, c2, toDestroy);
                    this.board[r2][c2].special = null; 
                }
            }

            triggerSpecial(type, r, c, toDestroy) {
                this.showFloatingText('BÜYÜ: ' + type.toUpperCase(), '#00e5ff');
                if (type === 'bomb') {
                    for(let i=-1; i<=1; i++) {
                        for(let j=-1; j<=1; j++) {
                            if(r+i>=0 && r+i<ROWS && c+j>=0 && c+j<COLS) toDestroy.push({r: r+i, c: c+j});
                        }
                    }
                } else if (type === 'lightning') {
                    for(let i=0; i<ROWS; i++) toDestroy.push({r: i, c: c});
                } else if (type === 'freeze') {
                    this.isFrozen = true; 
                }
            }

            applyGravity() {
                for (let c = 0; c < COLS; c++) {
                    for (let r = ROWS - 2; r >= 0; r--) {
                        if (this.board[r][c] !== null) {
                            let currR = r;
                            while (currR + 1 < ROWS && this.board[currR + 1][c] === null) {
                                this.board[currR + 1][c] = this.board[currR][c];
                                this.board[currR][c] = null;
                                currR++;
                            }
                        }
                    }
                }
            }

            fireGarbage(stacks) {
                let attackText = document.createElement('div');
                attackText.className = 'attack-alert';
                attackText.innerText = stacks > 1 ? `ÇOKLU ÇÖP x${stacks}!` : 'ÇÖP GÖNDERİLDİ!';
                attackText.style.color = '#ab47bc';
                this.boxEl.appendChild(attackText);
                setTimeout(() => attackText.remove(), 1000);

                socket.emit('attack_opponent', { dmg: 0, garbageCount: stacks * 2 });
            }

            receiveAttack(dmg, garbageCount) {
                if (dmg > 0) {
                    let actualDmg = dmg * this.stats.defMult;
                    if (this.shield > 0) {
                        if (actualDmg <= this.shield) { this.shield -= actualDmg; actualDmg = 0; } 
                        else { actualDmg -= this.shield; this.shield = 0; }
                    }
                    if (actualDmg > 0) this.hp -= actualDmg;

                    this.boxEl.classList.add('shake');
                    setTimeout(() => this.boxEl.classList.remove('shake'), 300);
                    this.showFloatingText(`-${Math.floor(dmg)} HP`, '#ff1744');
                }

                if (garbageCount > 0) {
                    this.garbageQueue += garbageCount;
                    this.showFloatingText(`+${garbageCount} TAŞ`, '#9e9e9e');
                }

                this.updateUI();

                if (this.hp <= 0) {
                    endGame("ÖLDÜN! RAKİP KAZANDI ☠️");
                    socket.emit('attack_opponent', { dmg: 9999, garbageCount: 0 }); 
                }
            }

            useUltimate() {
                if (this.rage < 100 || !isGameActive) return;
                this.rage = 0;
                
                let ultText = document.createElement('div');
                ultText.className = 'attack-alert';
                ultText.innerText = 'RAGE ULTIMATE!!';
                ultText.style.color = '#ffeb3b';
                this.boxEl.appendChild(ultText);
                setTimeout(() => ultText.remove(), 1000);

                socket.emit('attack_opponent', { dmg: 80 / this.enemy.stats.defMult, garbageCount: 5 });
                this.updateUI();
            }

            updateUI() {
                let hpPct = Math.max(0, (this.hp / this.maxHp) * 100);
                let shieldPct = Math.max(0, (this.shield / this.maxShield) * 100);
                let ragePct = Math.max(0, Math.min(100, this.rage));
                let atkPct = Math.max(0, Math.min(100, (this.attackBar / ATTACK_THRESHOLD) * 100));

                document.getElementById(`${this.id}-hp-fill`).style.width = hpPct + '%';
                document.getElementById(`${this.id}-hp-text`).innerText = `❤️ CAN: ${Math.floor(this.hp)} / ${this.maxHp}`;
                document.getElementById(`${this.id}-shield-fill`).style.width = shieldPct + '%';
                document.getElementById(`${this.id}-shield-text`).innerText = `🛡️ ZIRH: ${Math.floor(this.shield)} / ${this.maxShield}`;
                document.getElementById(`${this.id}-rage-fill`).style.width = ragePct + '%';
                document.getElementById(`${this.id}-rage-text`).innerText = `🔥 ÖFKE: %${Math.floor(ragePct)}`;
                document.getElementById(`${this.id}-attack-fill`).style.width = atkPct + '%';
                document.getElementById(`${this.id}-attack-text`).innerText = `⚔️ ÇÖP BARI: ${Math.floor(this.attackBar)} / ${ATTACK_THRESHOLD}`;

                let ultBtn = document.getElementById(`${this.id}-ult`);
                if(ultBtn) {
                    if (this.rage >= 100) ultBtn.classList.add('ready');
                    else ultBtn.classList.remove('ready');
                }
            }

            showFloatingText(text, color) {
                const floatEl = document.createElement('div');
                floatEl.className = 'floating-text';
                floatEl.innerText = text;
                floatEl.style.color = color;
                floatEl.style.left = `${this.boxEl.offsetWidth / 2 - 40 + (Math.random()*40-20)}px`;
                floatEl.style.top = `${this.boxEl.offsetHeight / 2 + (Math.random()*40-20)}px`;
                this.boxEl.appendChild(floatEl);
                setTimeout(() => floatEl.remove(), 1000);
            }

            render() {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        let cell = document.getElementById(`${this.id}-c-${r}-${c}`);
                        let block = this.board[r][c];

                        if (this.currentPiece && this.currentPiece.r === r && this.currentPiece.c === c) {
                            block = { val: this.currentPiece.val, special: this.currentPiece.special };
                        }

                        if (!block) {
                            cell.innerText = ''; cell.className = 'cell'; cell.innerHTML = '';
                            cell.style.boxShadow = 'none'; cell.style.border = 'none';
                        } else {
                            if (block.val === -1) {
                                cell.className = 'cell val-garbage'; cell.innerHTML = '🪨';
                                cell.style.boxShadow = 'none'; cell.style.border = 'none';
                            } else {
                                cell.className = `cell val-${block.val}`; cell.innerText = block.val;
                                if (block.special) {
                                    cell.innerHTML += `<div class="special-icon" style="color:${block.special.color}">${block.special.icon}</div>`;
                                    cell.style.boxShadow = `inset 0 0 15px ${block.special.color}`; cell.style.border = `2px solid ${block.special.color}`;
                                } else {
                                    cell.style.border = 'none'; cell.style.boxShadow = 'none';
                                }
                            }
                        }
                    }
                }

                if (this === localPlayer) {
                    socket.emit('sync_state', {
                        board: this.board,
                        hp: this.hp,
                        shield: this.shield,
                        rage: this.rage,
                        attackBar: this.attackBar,
                        garbageQueue: this.garbageQueue,
                        currentPiece: this.currentPiece
                    });
                }
            }
        }

        function endGame(text) {
            isGameActive = false;
            clearInterval(tickInterval);
            document.getElementById('winner-text').innerText = text;
            document.getElementById('game-over').style.display = 'flex';
        }

        document.addEventListener('keydown', (e) => {
            if (!isGameActive || !localPlayer) return;

            if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"].indexOf(e.key) > -1) {
                e.preventDefault(); 
            }

            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') localPlayer.move(-1);
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') localPlayer.move(1);
            if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') localPlayer.drop(false);
            if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') localPlayer.drop(true);
            if (e.key === 'q' || e.key === 'Q' || e.key === 'Enter') localPlayer.useUltimate();
        });
    </script>
</body>
</html>
